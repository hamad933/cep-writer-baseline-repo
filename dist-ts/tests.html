<!doctype html><html lang="en"><meta charset="utf-8"><title>CEP deterministic model contracts</title><style>body{font:16px system-ui;background:#15191f;color:#edf1f7;max-width:1100px;margin:40px auto}td,th{padding:12px;text-align:left;border-bottom:1px solid #444}.PASS{color:#8de6a9}.FAIL{color:#ffaaaa}</style><h1>Deterministic model contracts</h1><p>These are model assertions. Browser interactions and Owner acceptance are separate evidence.</p><button id="run">Run contracts</button><output id="summary"></output><table><thead><tr><th>Test</th><th>Owner</th><th>Oracle</th><th>Result</th></tr></thead><tbody id="results"></tbody></table><script type="module">import {runModelTests} from './model-tests.js';document.querySelector('#run').onclick=()=>{const r=runModelTests();document.querySelector('#summary').textContent=` ${r.filter(t=>t.status==='PASS').length}/${r.length} passed`;document.querySelector('#results').innerHTML=r.map(t=>`<tr><td>${t.id}</td><td>${t.owner}</td><td>${t.oracle}</td><td class="${t.status}">${t.status}</td></tr>`).join('')};</script></html>
