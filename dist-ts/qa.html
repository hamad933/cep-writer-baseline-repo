<!doctype html><html lang="en"><meta charset="utf-8"><title>CEP responsive evidence harness</title><style>body{margin:0;background:#20242b;color:#eff3fb;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}select,button{font:inherit;padding:6px}iframe{border:0;display:block;background:#091621}output{font:12px monospace}p{margin:6px 12px}</style><header><label>Width <select id="width"><option>1280</option><option>1024</option><option>720</option><option>390</option></select></label><label>Consumer <select id="consumer"><option>library</option><option>learn</option><option>visualize</option><option>runs</option><option>golden</option><option>reference</option></select></label><button id="reload">Load viewport</button><output id="state"></output></header><p>Real iframe layout viewport. Top-level browser zoom is a separate test. Reference uses the immutable accepted HTML.</p><iframe id="viewport" title="Candidate viewport" width="1280" height="800"></iframe><script>
