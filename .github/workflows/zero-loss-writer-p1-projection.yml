name: CEP Writer P1 Reference Projection

on:
  push:
    branches:
      - controller/zero-loss-repo-cleanup
    paths:
      - .github/workflows/zero-loss-writer-p1-projection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Build Writer-safe Oracle and Golden projections
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          ROOT=Path(".")
          IDS={
              "oracle":"1rpfeBYCptcZ_G4wMnglJ37icyVUn3oz1",
              "parity":"1egSEDzFD-B1qNppk2JHSvkZ_3rZ2CxXP",
              "scenarios":"1eoMJ1eJHUZKnUTQvTe2jbMe7QOeOztCS",
          }

          info=json.loads(base64.b64decode(os.environ["GDRIVE_SA_JSON_B64"]).decode())
          creds=service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive.readonly"])
          creds.refresh(Request())
          headers={"Authorization":f"Bearer {creds.token}"}

          def download(fid):
              r=requests.get(
                  f"https://www.googleapis.com/drive/v3/files/{fid}",
                  headers=headers,
                  params={"alt":"media","supportsAllDrives":"true"},
                  timeout=60,
              )
              r.raise_for_status()
              return r.content

          src={k:download(v) for k,v in IDS.items()}
          srcsha={k:hashlib.sha256(v).hexdigest() for k,v in src.items()}

          refroot=ROOT/"cep-writer"/"references"
          golden=refroot/"library-golden"
          golden.mkdir(parents=True,exist_ok=True)

          registry=json.loads(src["oracle"].decode("utf-8-sig"))
          local_map={
              "ORACLE-001":"cep-writer/CURRENT_WRITER_BASELINE_STATE.json",
              "ORACLE-002":"stack/native-typescript/foundation/presentation-carrier/CEP_LIBRARY_EDITOR_EXECUTABLE_BLUEPRINT_v1.2.17_ACCEPTED_DESIGN_REFERENCE.html",
              "ORACLE-003":"cep-writer/references/library-golden/GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md",
              "ORACLE-004":"cep-writer/references/library-golden/GOLDEN_BROWSER_SCENARIOS.json",
              "ORACLE-005":"cep-writer/authority/WRITER_OWNER_DECISIONS.csv",
              "ORACLE-006":"cep-writer/references/domain-oracles/W02_DURABLE_REQUIREMENTS_PROJECTION.md",
              "ORACLE-007":"cep-writer/references/domain-oracles/CEP_W03_WORK_MASTER_PLAN_A-M_2026-08-31.md",
              "ORACLE-008":"cep-writer/references/CEP_RUNTIME_PERSISTENCE_BRIDGE_TECHNICAL_REFERENCE.md",
              "ORACLE-009":"cep-writer/references/FINAL_VISUAL_REFERENCE_REGISTER.md",
              "ORACLE-010":"cep-writer/references/CEP_FINAL_VISUAL_INTERACTION_CONTRACT.md",
              "ORACLE-011":"cep-writer/references/domain-oracles/CEP_PRD_001_A03_PROGRESS_AND_EVIDENCE_OPERATING_MODEL_v1.0_APPROVED.md",
              "ORACLE-012":"cep-writer/references/domain-oracles/CEP_W05_WORK_MASTER_PLAN_A-M_2026-08-31.md",
              "ORACLE-013":"cep-writer/references/23_SURFACE_ZERO_LOSS_IDENTITY_REFERENCE_MATRIX.md",
              "ORACLE-FAILURE-001":None,
          }

          oracles=[]
          for item in registry:
              oid=item.get("id")
              local=local_map.get(oid)
              oracles.append({
                  "id":oid,
                  "name":item.get("name"),
                  "classification":item.get("classification"),
                  "use":item.get("use"),
                  "prohibition":item.get("prohibition"),
                  "hardGate":item.get("hardGate"),
                  "localPath":local,
                  "writerAvailability":"LOCAL" if local else "CONTROLLER_LINEAGE_ONLY__NOT_REQUIRED_FOR_NORMAL_WRITER_EXECUTION",
                  "sourceFileId":item.get("fileId"),
              })

          (refroot/"ORACLE_INDEX.json").write_text(
              json.dumps({
                  "schemaVersion":1,
                  "classification":"WRITER_ORACLE_INDEX_PROJECTION__NOT_LIVE_CONTROLLER_AUTHORITY",
                  "sourceRegistryDriveId":IDS["oracle"],
                  "sourceRegistrySha256":srcsha["oracle"],
                  "rule":"Local payload presence never widens its oracle classification/use/prohibition. Current Owner decisions and mission overlays supersede conflicting historical clauses.",
                  "oracles":oracles,
              },indent=2,ensure_ascii=False)+"\n",
              encoding="utf-8",
          )

          parity_text=src["parity"].decode("utf-8-sig")
          (golden/"GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md").write_text(
              parity_text,encoding="utf-8")

          raw=json.loads(src["scenarios"].decode("utf-8-sig"))
          scenario_rows=[]
          keep=[
              "scenario_id","name_ar","area","priority","authority","execution_mode",
              "start_state","user_actions","expected_dom_state","expected_visual_result",
              "limitations","rejection_gate",
          ]
          for scenario in raw.get("scenarios",[]):
              scenario_rows.append({key:scenario.get(key) for key in keep})

          (golden/"GOLDEN_BROWSER_SCENARIOS.json").write_text(
              json.dumps({
                  "schema_version":3,
                  "classification":"WRITER_GOLDEN_INTERACTION_SCENARIO_CONTRACT__DERIVED_FROM_ACCEPTED_ORACLE__NO_HISTORICAL_EVIDENCE_PATHS",
                  "source_drive_id":IDS["scenarios"],
                  "source_sha256":srcsha["scenarios"],
                  "authority":raw.get("authority"),
                  "scenario_contract":raw.get("scenario_contract"),
                  "golden_parity_laws":raw.get("golden_parity_laws",[]),
                  "scenarios":scenario_rows,
                  "exclusions_and_limits":raw.get("exclusions_and_limits",[]),
              },indent=2,ensure_ascii=False)+"\n",
              encoding="utf-8",
          )

          patterns=[
              re.compile(r"-----BEGIN [A-Z ]*PRIVATE KEY-----"),
              re.compile(r"(?i)(refresh_token|client_secret|api[_-]?key|github[_-]?token)\s*[:=]\s*[\"'][^\"']{8,}"),
              re.compile(r"(?i)Bearer\s+[A-Za-z0-9._-]{20,}"),
          ]
          outputs=[
              refroot/"ORACLE_INDEX.json",
              golden/"GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md",
              golden/"GOLDEN_BROWSER_SCENARIOS.json",
          ]
          for output in outputs:
              body=output.read_text(encoding="utf-8")
              if any(pattern.search(body) for pattern in patterns):
                  raise SystemExit("PUBLIC_DISCLOSURE_SCAN_FAIL:"+str(output))

          print(json.dumps({
              "oracleIndexEntries":len(oracles),
              "goldenScenarioRows":len(scenario_rows),
              "paritySourceSha256":srcsha["parity"],
              "scenarioSourceSha256":srcsha["scenarios"],
          },indent=2))
          PY
      - name: Commit P1 projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEP_CONTROLLER"
          git config user.email "cep-controller@local.invalid"
          git add cep-writer/references/ORACLE_INDEX.json
          git add cep-writer/references/library-golden/GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md
          git add cep-writer/references/library-golden/GOLDEN_BROWSER_SCENARIOS.json
          git commit -m "controller: add current Writer oracle and golden reference projections"
          git push origin HEAD:controller/zero-loss-repo-cleanup
