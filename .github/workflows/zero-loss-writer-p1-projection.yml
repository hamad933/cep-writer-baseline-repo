name: CEP Writer P1 Reference Projection

on:
  push:
    branches:
      - controller/zero-loss-repo-cleanup
    paths:
      - .github/workflows/zero-loss-writer-p1-projection.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  project:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Build Writer-safe P1 projections from exact Drive sources
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, re
          from pathlib import Path
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          ROOT=Path('.')
          IDS={
            'oracle':'1rpfeBYCptcZ_G4wMnglJ37icyVUn3oz1',
            'parity':'1egSEDzFD-B1qNppk2JHSvkZ_3rZ2CxXP',
            'scenarios':'1eoMJ1eJHUZKnUTQvTe2jbMe7QOeOztCS',
            'w02':'1EFuYHzCp6Av7uA1pXgbJQLG6u4u4Lkyq',
          }
          info=json.loads(base64.b64decode(os.environ['GDRIVE_SA_JSON_B64']).decode())
          creds=service_account.Credentials.from_service_account_info(
            info, scopes=['https://www.googleapis.com/auth/drive.readonly'])
          creds.refresh(Request())
          headers={'Authorization':f'Bearer {creds.token}'}

          def download(fid):
            r=requests.get(
              f'https://www.googleapis.com/drive/v3/files/{fid}',
              headers=headers,params={'alt':'media','supportsAllDrives':'true'},timeout=60)
            r.raise_for_status()
            return r.content

          src={k:download(v) for k,v in IDS.items()}
          srcsha={k:hashlib.sha256(v).hexdigest() for k,v in src.items()}

          refroot=ROOT/'cep-writer'/'references'
          golden=refroot/'library-golden'
          golden.mkdir(parents=True,exist_ok=True)

          registry=json.loads(src['oracle'].decode('utf-8-sig'))
          local_map={
            'ORACLE-001':'cep-writer/CURRENT_WRITER_BASELINE_STATE.json',
            'ORACLE-002':'stack/native-typescript/foundation/presentation-carrier/CEP_LIBRARY_EDITOR_EXECUTABLE_BLUEPRINT_v1.2.17_ACCEPTED_DESIGN_REFERENCE.html',
            'ORACLE-003':'cep-writer/references/library-golden/GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md',
            'ORACLE-004':'cep-writer/references/library-golden/GOLDEN_BROWSER_SCENARIOS.json',
            'ORACLE-005':'cep-writer/authority/WRITER_OWNER_DECISIONS.csv',
            'ORACLE-006':'cep-writer/references/domain-oracles/W02_DURABLE_REQUIREMENTS_PROJECTION.md',
            'ORACLE-007':'cep-writer/references/domain-oracles/CEP_W03_WORK_MASTER_PLAN_A-M_2026-08-31.md',
            'ORACLE-008':'cep-writer/references/CEP_RUNTIME_PERSISTENCE_BRIDGE_TECHNICAL_REFERENCE.md',
            'ORACLE-009':'cep-writer/references/FINAL_VISUAL_REFERENCE_REGISTER.md',
            'ORACLE-010':'cep-writer/references/CEP_FINAL_VISUAL_INTERACTION_CONTRACT.md',
            'ORACLE-011':'cep-writer/references/domain-oracles/CEP_PRD_001_A03_PROGRESS_AND_EVIDENCE_OPERATING_MODEL_v1.0_APPROVED.md',
            'ORACLE-012':'cep-writer/references/domain-oracles/CEP_W05_WORK_MASTER_PLAN_A-M_2026-08-31.md',
            'ORACLE-013':'cep-writer/references/23_SURFACE_ZERO_LOSS_IDENTITY_REFERENCE_MATRIX.md',
            'ORACLE-FAILURE-001':None,
          }
          index=[]
          for item in registry:
            oid=item.get('id')
            index.append({
              'id':oid,
              'name':item.get('name'),
              'classification':item.get('classification'),
              'use':item.get('use'),
              'prohibition':item.get('prohibition'),
              'hardGate':item.get('hardGate'),
              'localPath':local_map.get(oid),
              'writerAvailability': 'LOCAL' if local_map.get(oid) else 'CONTROLLER_LINEAGE_ONLY__NOT_REQUIRED_FOR_NORMAL_WRITER_EXECUTION',
              'sourceFileId':item.get('fileId') or (IDS['oracle'] if oid=='ORACLE-001' else None),
            })
          oracle_out={
            'schemaVersion':1,
            'classification':'WRITER_ORACLE_INDEX_PROJECTION__NOT_LIVE_CONTROLLER_AUTHORITY',
            'sourceRegistryDriveId':IDS['oracle'],
            'sourceRegistrySha256':srcsha['oracle'],
            'rule':'Local payload presence never widens the oracle classification/use/prohibition. Current Owner decisions and mission overlays supersede conflicting historical clauses.',
            'oracles':index
          }
          (refroot/'ORACLE_INDEX.json').write_text(json.dumps(oracle_out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          # Exact accepted parity report is safe public reference; preserve text verbatim.
          parity_text=src['parity'].decode('utf-8-sig')
          (golden/'GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md').write_text(parity_text,encoding='utf-8')

          raw=json.loads(src['scenarios'].decode('utf-8-sig'))
          scenario_rows=[]
          for s in raw.get('scenarios',[]):
            scenario_rows.append({
              k:s.get(k) for k in [
                'scenario_id','name_ar','area','priority','authority','execution_mode',
                'start_state','user_actions','expected_dom_state','expected_visual_result',
                'limitations','rejection_gate'
              ]
            })
          scenario_out={
            'schema_version':3,
            'classification':'WRITER_GOLDEN_INTERACTION_SCENARIO_CONTRACT__DERIVED_FROM_ACCEPTED_ORACLE__NO_HISTORICAL_EVIDENCE_PATHS',
            'source_drive_id':IDS['scenarios'],
            'source_sha256':srcsha['scenarios'],
            'authority':raw.get('authority'),
            'scenario_contract':raw.get('scenario_contract'),
            'golden_parity_laws':raw.get('golden_parity_laws',[]),
            'scenarios':scenario_rows,
            'exclusions_and_limits':raw.get('exclusions_and_limits',[])
          }
          (golden/'GOLDEN_BROWSER_SCENARIOS.json').write_text(json.dumps(scenario_out,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          w02_projection=f"""# W02 Durable Requirements Projection

Classification: `DURABLE_W02_PRODUCT_UX_REQUIREMENTS__DERIVED_PROJECTION__HISTORICAL_IMPLEMENTATION_BINDINGS_REMOVED`

Source:
- Drive ID: `{IDS['w02']}`
- SHA-256 of exact source bytes used for this projection: `{srcsha['w02']}`
- Oracle classification: `DURABLE_PRODUCT_UX_REQUIREMENT_DONOR_WITH_HISTORICAL_IMPLEMENTATION_BINDING`

This file intentionally does **not** carry the source document's old branch/SHA, Laravel/Vue/PHP paths, database proposals, old execution sequencing or historical runtime observations. Those are not current implementation authority.

## Durable W02 object/owner laws

- One canonical Knowledge Unit may be projected by Library, Learn, Visualize and Research & Quality; a Surface must not create its own duplicate canonical KU.
- Lesson revisions belong to Knowledge / Unified Editor truth. Published revision history is immutable/superseding; Learn consumes published truth rather than an independent lesson copy.
- Curriculum placement/prerequisite/pathway truth remains Curriculum-owned. Visual dragging may alter representation state only unless a separately authorized canonical relation command executes.
- Source / Claim / Anchor truth remains Source-Governance-owned. Surface presentation must reference rather than duplicate the canonical source/claim object.
- Practice Activity belongs to Learning. Practice progress is not Mastery or Evidence by implication.
- Map is a Visualization representation over canonical objects, not a fifth canonical object store.
- Evidence/Mastery truth remains outside W02 unless an admitted governed provider/owner explicitly supplies it.

## Continuity laws

- `object=<KU-ID>` is the shared cross-Surface continuity identity.
- Revision/source/map/view/overlay/node/mode state is Surface-specific and must not leak to another Surface without an explicit conversion.
- Back/Forward and return navigation preserve useful object/context state without cloning canonical objects.
- Surface-local transient state may be session/history/local preference state only when it is not canonical domain truth.

## Region and action-home laws

Library:
- TOP: Save/Apply, Undo/Redo, truthful save status, History/Compare entry.
- LEFT: search + canonical hierarchy.
- CENTER: document/editor.
- RIGHT: selected-object provenance/authority/context.
- BOTTOM: Compare/History/Recovery deep work.

Learn:
- LEFT: journey structure.
- CENTER: selected learning activity only.
- RIGHT: prerequisites/next/source summary.
- Do not duplicate the practice/activity list in CENTER.

Visualize:
- TOP: map/view/overlay/viewport controls and representation-save actions when truthfully available.
- LEFT: maps/scope/structure.
- CENTER: actual Tree/Path/Graph/Canvas representation.
- RIGHT: selected node/relation/overlay only.
- BOTTOM: deep trace/raw relation inspection where applicable.

Research & Quality:
- TOP: Claims/Compare/Conflicts/Revision modes and bounded handoff actions.
- LEFT: sources/filters.
- CENTER: claim/compare/conflict/revision work.
- RIGHT: provenance/authority for current selection.
- BOTTOM: deep diff/trace.

Global:
- Primary Surface navigation has one authoritative home.
- Save/Undo/Redo have one authoritative home.
- Block-local actions belong to block/action surfaces, not duplicate permanent toolbar homes.
- Deep comparison/diagnostics are contextual/BOTTOM work, not permanent page chrome.

## State and truth laws

- Panel width/collapse/zoom/transient selection are Presentation/session state, not canonical domain truth.
- Editor recovery is not Save; Autosave is not Explicit Save; acknowledged saved snapshot must correspond to the exact submitted content/revision.
- Reading position is not Completion; Completion is not Mastery.
- Visualize zoom/selection/positions are representation state unless an admitted persistence owner saves representation state.
- RQ notes/analysis must not silently become permanent review/mastery/canonical truth.

## Responsive / Presentation laws

- Accepted desktop is 1440×1000 primary comparison; ~1024 geometry is mandatory secondary validation.
- CENTER remains the dominant work region.
- Constrained layouts must not solve responsiveness by duplicating RIGHT or stacking permanent copies of the same content.
- RIGHT may become an on-demand overlay/reveal while preserving one DOM/semantic owner.
- BOTTOM remains one deep-work surface, normally closed unless task context requires it.

## Bidi laws

- Natural content uses logical text with auto/plaintext direction where applicable.
- Technical IDs, URLs, code, hashes, paths and timestamps remain isolated LTR atoms.
- Do not inject Unicode directional control characters into stored domain text merely to repair presentation.
- Save/reload/recovery must preserve logical text order.

## Current-authority overlay

Current Owner decisions, current SurfaceProfiles, current domain/provider oracles, current visual-reference register, current accepted shared owners and the exact mission overlay always supersede conflicting historical W02 implementation proposals.
"""
          dor=refroot/'domain-oracles'
          dor.mkdir(parents=True,exist_ok=True)
          (dor/'W02_DURABLE_REQUIREMENTS_PROJECTION.md').write_text(w02_projection,encoding='utf-8')

          # Public-repo safety: no token/private-key/password patterns in new outputs.
          pats=[
            re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----'),
            re.compile(r'(?i)(refresh_token|client_secret|api[_-]?key|github[_-]?token)\s*[:=]\s*["\'][^"\']{8,}'),
            re.compile(r'(?i)Bearer\s+[A-Za-z0-9._-]{20,}')
          ]
          for p in [refroot/'ORACLE_INDEX.json',golden/'GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md',golden/'GOLDEN_BROWSER_SCENARIOS.json',dor/'W02_DURABLE_REQUIREMENTS_PROJECTION.md']:
            t=p.read_text(encoding='utf-8')
            if any(rx.search(t) for rx in pats):
              raise SystemExit('PUBLIC_DISCLOSURE_SCAN_FAIL:'+str(p))
          print(json.dumps({
            'oracleIndexEntries':len(index),
            'goldenScenarioRows':len(scenario_rows),
            'paritySourceSha256':srcsha['parity'],
            'scenarioSourceSha256':srcsha['scenarios'],
            'w02SourceSha256':srcsha['w02']
          },indent=2))
          PY
      - name: Commit P1 projections
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEP_CONTROLLER"
          git config user.email "cep-controller@local.invalid"
          git add             cep-writer/references/ORACLE_INDEX.json             cep-writer/references/library-golden/GOLDEN_LIBRARY_VISUAL_INTERACTION_PARITY_MATRIX.md             cep-writer/references/library-golden/GOLDEN_BROWSER_SCENARIOS.json             cep-writer/references/domain-oracles/W02_DURABLE_REQUIREMENTS_PROJECTION.md
          git commit -m "controller: add current Writer oracle and golden reference projections"
          git push origin HEAD:controller/zero-loss-repo-cleanup
