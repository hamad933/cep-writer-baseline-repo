name: CEP Zero-Loss Writer Packet Validation
# Triggered after content-forensic checker compatibility correction v2.

on:
  push:
    branches:
      - controller/zero-loss-repo-cleanup
    paths:
      - .github/workflows/zero-loss-writer-packet-validation.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Verify exact working baseline ancestry and Product immutability
        shell: bash
        run: |
          set -euo pipefail
          BASE=293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          test "$(git rev-parse "$BASE^{tree}")" = "3101c06901dbdaff9602fea8098efb9c34575149"
          test -z "$(git diff --name-only "$BASE"...HEAD -- stack/native-typescript)"

      - name: Regenerate current Writer manifests from exact branch bytes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib, json, subprocess

          root=Path('.').resolve()
          BASE='293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a'
          TREE='3101c06901dbdaff9602fea8098efb9c34575149'
          PRODUCT='480dbe9d76cb2883b3a97b3cd618caaa2b0718572a78d86ad8941729a0cc9641'

          def meta(p):
              b=p.read_bytes()
              return {'size':len(b),'sha256':hashlib.sha256(b).hexdigest()}

          refs=[]
          for p in sorted((root/'cep-writer'/'references').rglob('*')):
              if p.is_file():
                  refs.append({'path':p.relative_to(root/'cep-writer').as_posix(),**meta(p)})
          (root/'cep-writer'/'REFERENCE_MANIFEST.json').write_text(json.dumps({
              'schemaVersion':4,
              'classification':'CURRENT_WRITER_REFERENCE_MANIFEST__WORKING_BASELINE__NOT_ACCEPTANCE',
              'baselineCommit':BASE,
              'baselineTree':TREE,
              'entries':refs
          },indent=2,ensure_ascii=False)+'\n',encoding='utf-8')

          raw=subprocess.check_output(['git','ls-files','-z'])
          tracked=[Path(x.decode()) for x in raw.split(b'\0') if x]
          exact={
              '.gitignore','README.md','package.json','package-lock.json',
              'BROWSER_CONFORMANCE_BOOTSTRAP.md','FOUNDATION_ARCHITECTURE.md'
          }
          prefixes=(
              'tools/','tests/','contracts/','profiles/','writer/',
              'stack/local-runtime/','stack/windows-platform/','dist/',
              'assurance/','cep-writer/'
          )
          entries=[]
          for rel in tracked:
              s=rel.as_posix()
              if s in {'cep-writer/WRITER_INPUT_MANIFEST.json','cep-writer/REFERENCE_MANIFEST.json'}:
                  continue
              if s.startswith('controller-cleanup/') or s.startswith('.github/workflows/zero-loss-'):
                  continue
              if s in exact or s.startswith(prefixes):
                  p=root/rel
                  if p.is_file(): entries.append({'path':s,**meta(p)})
          for s in ['cep-writer/REFERENCE_MANIFEST.json']:
              p=root/s; entries.append({'path':s,**meta(p)})
          entries.sort(key=lambda x:x['path'])

          (root/'cep-writer'/'WRITER_INPUT_MANIFEST.json').write_text(json.dumps({
              'schemaVersion':11,
              'classification':'CURRENT_WORKING_BASELINE_REQUIRED_INPUT_MANIFEST__STAGE1_ZERO_LOSS__NOT_LIVE_AUTHORITY',
              'productParentCommit':BASE,
              'productParentTree':TREE,
              'productCanonicalSourceSha256':PRODUCT,
              'productCanonicalSourceFiles':273,
              'executionMode':'MISSION_BRANCH_FROM_CONTROLLER_BOUND_WORKING_BASELINE',
              'noRequiredLiveDriveFetch':True,
              'missionOverlayPolicy':'BRANCH_LOCAL_IMMUTABLE_OVERLAY',
              'assurancePolicy':'STAGE1_KEEP_PENDING_CONTENT_LEVEL_OPERATIONAL_DEPENDENCY_REDUCTION',
              'entries':entries
          },indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          print(json.dumps({'referenceEntries':len(refs),'writerInputEntries':len(entries)},indent=2))
          PY

      - name: Public disclosure byte scan of cleanup delta
        shell: bash
        run: |
          python - <<'PY'
          import re, subprocess, pathlib, sys
          base='293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a'
          names=subprocess.check_output(['git','diff','--name-only',base+'...HEAD']).decode().splitlines()
          names += ['cep-writer/WRITER_INPUT_MANIFEST.json','cep-writer/REFERENCE_MANIFEST.json']
          pats=[
            re.compile(r'-----BEGIN [A-Z ]*PRIVATE KEY-----'),
            re.compile(r'(?i)(refresh_token|client_secret|api[_-]?key|github[_-]?token)\s*[:=]\s*["\'][^"\']{8,}'),
            re.compile(r'(?i)Bearer\s+[A-Za-z0-9._-]{20,}')
          ]
          bad=[]
          for n in sorted(set(names)):
            p=pathlib.Path(n)
            if not p.is_file() or p.stat().st_size>3_000_000: continue
            try: t=p.read_text(encoding='utf-8',errors='ignore')
            except Exception: continue
            if any(rx.search(t) for rx in pats): bad.append(n)
          if bad:
            print('DISCLOSURE_SCAN_FAIL',bad); sys.exit(2)
          print('DISCLOSURE_SCAN_PASS',len(set(names)))
          PY

      - name: Verify Writer self-containment
        run: python3 cep-writer/tools/verify_repo.py

      - name: Install dependencies
        run: npm ci

      - name: Rebuild runtime
        run: npm run build:runtime

      - name: Verify Product source identity after build
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module - <<'NODE' | tee /tmp/source-id.txt
          import { canonicalSourceIdentity } from './tools/source-tree-identity.mjs';
          const result = await canonicalSourceIdentity(new URL('./', import.meta.url));
          console.log(JSON.stringify({sha256: result.sha256, files: result.files}));
          NODE
          grep -q '480dbe9d76cb2883b3a97b3cd618caaa2b0718572a78d86ad8941729a0cc9641' /tmp/source-id.txt
          grep -q '"files":273' /tmp/source-id.txt
          test -z "$(git diff --name-only 293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a...HEAD -- stack/native-typescript)"

      - name: Model tests
        run: npm test

      - name: Contract and browser-evidence checks
        run: npm run check

      - name: Runtime falsification
        run: npm run runtime:check

      - name: Duplicate owner/mechanics checks
        run: node tools/check-duplicate-mechanics.mjs

      - name: Verify generated runtime reproducibility
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- dist

      - name: Commit regenerated manifests only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEP_CONTROLLER"
          git config user.email "cep-controller@local.invalid"
          git add cep-writer/WRITER_INPUT_MANIFEST.json cep-writer/REFERENCE_MANIFEST.json
          if git diff --cached --quiet; then
            echo "manifests already current"
            exit 0
          fi
          git commit -m "controller: regenerate current Writer input manifests"
          git push origin HEAD:controller/zero-loss-repo-cleanup
