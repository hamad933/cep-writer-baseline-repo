name: CEP Import Exact Working Baseline

on:
  push:
    branches:
      - baseline/working-293dd1e0
    paths:
      - .github/workflows/import-working-baseline.yml

permissions:
  contents: write

jobs:
  import-exact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and verify bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .cep-transport/ef7-to-293/chunk-*.b64 | base64 --decode > /tmp/ef7_to_293.bundle
          echo "922ccd98776c39ebbe58baf6ba7e76fe8e04b14115cedfec2f11fbeb1a84cc55  /tmp/ef7_to_293.bundle" | sha256sum -c -
          git bundle verify /tmp/ef7_to_293.bundle

      - name: Import exact candidate objects
        shell: bash
        run: |
          set -euo pipefail
          TARGET=293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a
          BASE=ef7de5e05eee79d1302a84c47ef41ba5e94364c6
          TREE=3101c06901dbdaff9602fea8098efb9c34575149
          git fetch /tmp/ef7_to_293.bundle refs/heads/__export293:refs/remotes/cep-import/exact
          test "$(git rev-parse refs/remotes/cep-import/exact)" = "$TARGET"
          test "$(git rev-parse "$TARGET^{tree}")" = "$TREE"
          git merge-base --is-ancestor "$BASE" "$TARGET"
          git push origin "$TARGET:refs/heads/baseline/exact-working-293dd1e0"
