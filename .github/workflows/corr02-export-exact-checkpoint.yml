name: CEP CORR02 Exact Checkpoint Source Export

on:
  push:
    branches:
      - controller/corr02-full-carrier-audit-da007840
    paths:
      - '.github/workflows/corr02-export-exact-checkpoint.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact Product checkpoint
        uses: actions/checkout@v4
        with:
          ref: da007840363d92cdadd9f7c5180449a49e6f1d19
          fetch-depth: 1

      - name: Prove exact checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "da007840363d92cdadd9f7c5180449a49e6f1d19"
          printf '%s\n' "$(git rev-parse HEAD)" > EXACT_CHECKPOINT.txt
          rm -rf .git

      - name: Upload exact checkpoint bytes
        uses: actions/upload-artifact@v4
        with:
          name: corr02-exact-checkpoint-da007840
          path: .
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
