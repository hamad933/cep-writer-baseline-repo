name: Controller CURRENT_STATE PR01 Runtime Sync

on:
  push:
    branches:
      - infra/gdrive-credential-smoke
    paths:
      - .github/workflows/controller-current-state-pr01-runtime-sync.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Record PR01 runtime prerequisite adjudication in CURRENT_STATE
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          FILE_ID="164CDevKZ48ZAXke44oL3jXIVpYQJBmRu"
          MARK="## PR01 runtime / interaction prerequisite adjudication — 2026-09-24"
          BLOCK="""## PR01 runtime / interaction prerequisite adjudication — 2026-09-24

          - Controller independent recheck confirms GitHub working baseline remains `main@37c4d765e1db854505c81cbd15b90d4715f6690e`, tree `57dbde7a730c687a341748dad4a725a052653f0b`, direct parent `f93b75310716f8cf527505ccfdbdb215eb4e3454`, Product source `480dbe9d76cb2883b3a97b3cd618caaa2b0718572a78d86ad8941729a0cc9641 / 273`. No remote `writer/cep-serial` branch or D03A Writer result was present at recheck. GitHub Actions run `35949704133` remains SUCCESS validation evidence only.
          - Exact-source runtime reproduction used GitHub artifact `10787764672` only as execution transport; artifact digest `sha256:9b2e0e5be449424cd78017bda520a36df179c3332160c55bec2608259e83e071`. Its `repo.bundle` verified exact checkpoint/tree/Product identity, clean worktree and Node `v22.16.0`.
          - With both local processes started on the exact checkpoint, UI/proof server `4173` responded, `runtime:local` listened on `127.0.0.1:4174`, `GET /v1/capabilities` returned HTTP 200, and `GET /v1/platform/input-direction` returned truthful HTTP 503 `WINDOWS_PLATFORM_UNAVAILABLE` in the Linux Controller environment. Therefore the predecessor Owner-session connection failures remain `ENVIRONMENT/STARTUP` because `runtime:local` had not been started; they are not proof of a CORS-header Product defect.
          - `OQA-RUNTIME-001`: Product mechanism source-proven. `tools/extract_donor.py` retains the accepted donor HTML carrier and appends current `main.js`; generated `dist/index.html` therefore contains donor workbench markup before current runtime composition. Target-Windows genuine-browser first-paint/timing proof remains OPEN.
          - `OQA-RUNTIME-002`: PRODUCT defect confirmed. `createLocalRuntimePlatformInputDirectionBridge()` performs synchronous main-thread `XMLHttpRequest.open(..., false)`; resolver/structured rendering creates request-amplification risk. Reachable `4174` does not make synchronous XHR acceptable.
          - `OQA-RUNTIME-003`: PRODUCT defect confirmed. `GlobalShellNavigationOwner.navigate()` and `navigateWithPreservedRecovery()` use `location.assign(...)`, creating full-document in-app navigation by construction.
          - `OQA-RUNTIME-004`: predecessor connection-failure evidence is ENVIRONMENT/STARTUP; current runtime-present Windows behavior and truthful runtime-absent degraded mode still require PR01 proof.
          - `OQA-RUNTIME-005`: EVIDENCE/ACCEPTANCE-CONTROL gap OPEN. Existing route/correctness tests do not substitute for first-paint, zero-sync-XHR, request-amplification, top-level-document-reload, long-task and interaction-timing evidence.
          - Controller browser harness cannot close these browser gates: installed Chromium is machine-managed with `URLBlocklist=["*"]` and blocks localhost; no Firefox executable is available. This is `HARNESS/ENVIRONMENT` only and is excluded from Product PASS/FAIL.
          - A Controller-direct Product correction is rejected under `OD-20260916-044` because the defect set crosses build/startup carrier behavior, input-direction bridge/resolver ownership, `GlobalShellNavigationOwner`, the `main.ts` lifecycle/router hotspot and performance-proof tooling.
          - New serialized prerequisite Mission `PR01_RUNTIME_INTERACTION_PREREQUISITE_CONVERGENCE` is live: Mission Drive `1gfsNuUKsaAqWmVB33dywmW6X_raDVK9QE0gTP8jMr0E`; Controller evidence Drive `1azLWmvWrHrKB_NshD0ytivDU9D6mhHbvBjjX-2wrZIY`; folder Drive `15ZgeK0D9cOegAt2cAjW06B49Tgb0iMuY`.
          - `MISSION_D03A_COMMAND_AND_SETTINGS_OWNER_CONVERGENCE` Drive `1iMqfjoNBJTGvJpCASpOoAnEaB0959ww4EOMwiWSRKe0` is rebound to `WAITING_FOR_PR01_CONTROLLER_ACCEPTED_CHECKPOINT__NO_WRITER_LAUNCH`; its scope is unchanged.
          - `POST_C03_EXECUTION_PLAN` Drive `1-ZpY8NHQDdBziM7ik0MO_dkEJIbbteInKWj8xMR67wM` now routes current LOCAL order `PR01 -> Controller audit -> retained PR01 checkpoint -> D03A -> D03B -> D03C -> D04`, then the existing downstream DAG unchanged.
          - `POST_C03_PROOF_GATE_PLAN` Drive `1WAQoM7g0VsjWy7LGPG0rcXUO3IrhWidCQ803MdmBSa8` now contains the PR01 runtime/performance prerequisite gate: zero synchronous XHR, no donor-to-current Shell first-paint swap, bounded input-direction calls, zero full-document reloads for ordinary in-app navigation, Back/Forward plus governed semantic-context preservation, truthful runtime-present/runtime-absent behavior, unchanged five functional destinations and `destinationCountFrozen=false`.
          - `main.ts` remains a D13 exclusive final-integration hotspot generally; PR01 receives only a temporary narrow pre-D03 exception for startup/router lifecycle required by OQA-RUNTIME-001/003. `GlobalShellNavigationOwner` correction is limited to runtime navigation/reload/history mechanics; D03B retains its governed pane/shared-Presentation and CBF-002 semantic-context scope.
          - No new Owner Decision was created: PR01 is a mission/state routing consequence under existing OD-044, OD-070, OD-079, OD-080 and OD-081. No Product acceptance, release, deployment or stack freeze is implied.
          - Current legal next action: run PR01 on ROUTE-LOCAL only from exact `37c4d765...` after Writer-agent preflight; obtain one clean local checkpoint; STOP; independent Controller audit/adjudication; only a retained accepted PR01 checkpoint may become D03A's exact parent.
          """.strip().replace("          ","")

          info=json.loads(base64.b64decode(os.environ["GDRIVE_SA_JSON_B64"]).decode())
          creds=service_account.Credentials.from_service_account_info(
              info, scopes=["https://www.googleapis.com/auth/drive"])
          creds.refresh(Request())
          headers={"Authorization":f"Bearer {creds.token}"}

          r=requests.get(
              f"https://www.googleapis.com/drive/v3/files/{FILE_ID}",
              headers=headers, params={"alt":"media","supportsAllDrives":"true"}, timeout=60)
          r.raise_for_status()
          text=r.content.decode("utf-8-sig")

          lines=text.splitlines()
          for i,line in enumerate(lines):
              if line.startswith("- Active mission class:"):
                  line=line.replace("__D03A_FIRST__","__PR01_FIRST__D03A_AFTER_PR01_ACCEPTED_CHECKPOINT__")
                  line=line.replace(
                    "__OQA_RUNTIME_001_005_OPEN__RUNTIME_4174_NOT_STARTED_CONFIRMED__D03A_PREREQUISITE_RUNTIME_DIAGNOSTIC_HOLD__",
                    "__OQA_RUNTIME_001_005_RECONSTRUCTED__OQA002_OQA003_PRODUCT_CONFIRMED__OQA001_SOURCE_PROVEN_BROWSER_CLOSURE_OPEN__OQA004_PREDECESSOR_4174_FAILURE_ENVIRONMENT_STARTUP__OQA005_PERFORMANCE_GATE_OPEN__PR01_RUNTIME_INTERACTION_PREREQUISITE_CREATED__D03A_WAITING_FOR_PR01_ACCEPTED_CHECKPOINT__")
                  lines[i]=line
                  break
          else:
              raise RuntimeError("Active mission class line not found")

          text="\n".join(lines)+"\n"
          if MARK in text:
              s=text.index(MARK)
              e=text.find("\n## ", s+len(MARK))
              if e<0:
                  text=text[:s].rstrip()+"\n\n"+BLOCK+"\n"
              else:
                  text=text[:s].rstrip()+"\n\n"+BLOCK+"\n\n"+text[e+1:].lstrip()
          else:
              text=text.rstrip()+"\n\n"+BLOCK+"\n"

          required=[
            "__PR01_FIRST__D03A_AFTER_PR01_ACCEPTED_CHECKPOINT__",
            "__PR01_RUNTIME_INTERACTION_PREREQUISITE_CREATED__D03A_WAITING_FOR_PR01_ACCEPTED_CHECKPOINT__",
            MARK,
            "1gfsNuUKsaAqWmVB33dywmW6X_raDVK9QE0gTP8jMr0E",
            "1azLWmvWrHrKB_NshD0ytivDU9D6mhHbvBjjX-2wrZIY",
            "main@37c4d765e1db854505c81cbd15b90d4715f6690e",
            "OQA-RUNTIME-002",
            "OQA-RUNTIME-003"
          ]
          for token in required:
              if token not in text:
                  raise RuntimeError("missing required state token: "+token)

          w=requests.patch(
              f"https://www.googleapis.com/upload/drive/v3/files/{FILE_ID}",
              headers={**headers,"Content-Type":"text/markdown; charset=utf-8"},
              params={"uploadType":"media","supportsAllDrives":"true"},
              data=text.encode("utf-8"), timeout=60)
          w.raise_for_status()

          v=requests.get(
              f"https://www.googleapis.com/drive/v3/files/{FILE_ID}",
              headers=headers, params={"alt":"media","supportsAllDrives":"true"}, timeout=60)
          v.raise_for_status()
          final=v.content.decode("utf-8-sig")
          for token in required:
              if token not in final:
                  raise RuntimeError("readback missing state token: "+token)
          print("CURRENT_STATE_PR01_RUNTIME_SYNC_PASS")
          print("BYTES",len(final.encode("utf-8")))
          PY
