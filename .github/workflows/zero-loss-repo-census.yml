name: CEP Zero-Loss Repository Census

on:
  push:
    branches:
      - controller/zero-loss-repo-cleanup
    paths:
      - .github/workflows/zero-loss-repo-census.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact cleanup branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify working baseline ancestry and branch-only controller delta
        shell: bash
        run: |
          set -euo pipefail
          BASE=293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          EXTRA="$(git diff --name-only "$BASE"...HEAD | grep -v '^\.github/workflows/zero-loss-repo-census\.yml$' || true)"
          test -z "$EXTRA"

      - name: Generate zero-loss census
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import csv, hashlib, json, os, re, subprocess
          from collections import Counter, defaultdict

          ROOT = Path(".").resolve()
          OUT = ROOT / "controller-cleanup"
          OUT.mkdir(exist_ok=True)

          raw = subprocess.check_output(["git","ls-files","-z"])
          paths = [Path(p.decode("utf-8")) for p in raw.split(b"\0") if p]
          # Do not inventory the generated controller-cleanup outputs themselves.
          paths = [p for p in paths if not str(p).startswith("controller-cleanup/")]

          text_ext = {".md",".txt",".json",".csv",".js",".mjs",".ts",".tsx",".py",".html",".css",".yml",".yaml",".toml",".ini",".xml"}
          text_docs = {}
          explicit_refs = set()
          ref_re = re.compile(r"(?<![A-Za-z0-9_.-])((?:assurance|archaeology|cep-writer|authority|dist|writer-output|profiles|contracts|tools|stack|tests)/[^\s`\"'<>|]+)")
          for p in paths:
              fp = ROOT / p
              if p.suffix.lower() not in text_ext or not fp.is_file() or fp.stat().st_size > 2_500_000:
                  continue
              try:
                  txt = fp.read_text(encoding="utf-8", errors="ignore")
              except Exception:
                  continue
              text_docs[str(p)] = txt
              for m in ref_re.finditer(txt):
                  token = m.group(1).rstrip(").,;:]}")
                  explicit_refs.add(token)

          def sha256(fp: Path):
              h=hashlib.sha256()
              with fp.open("rb") as f:
                  for chunk in iter(lambda:f.read(1024*1024),b""):
                      h.update(chunk)
              return h.hexdigest()

          rows=[]
          by_sha=defaultdict(list)
          old_parent_tokens={"64a31e409c860a1e266101fd38fcb01f679327a2","16588836714764f10bc52066827e82b98b6809284e9aabeb19dd1e92580b6e36"}
          current_baseline="293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a"

          def classify(path:str, content:str):
              referenced = path in explicit_refs
              top = path.split("/",1)[0]
              # Hard KEEP families.
              if top in {"stack","contracts","profiles","tools","tests"} or path in {"package.json","package-lock.json",".gitignore"}:
                  return "KEEP_CORE_BUILD_TEST", "core/source/build/test/tooling"
              if path.startswith(".github/"):
                  return "KEEP_OR_REVIEW_AUTOMATION", "workflow/infrastructure; inspect before retirement"
              if path.startswith("cep-writer/references/visual/"):
                  return "KEEP_WRITER_VISUAL_REFERENCE", "governed Writer visual input"
              if path.startswith("cep-writer/references/domain-oracles/") or path.startswith("cep-writer/references/surface-profiles/"):
                  return "KEEP_WRITER_DOMAIN_PROFILE_REFERENCE", "Writer oracle/profile input"
              if path.startswith("cep-writer/references/"):
                  return "KEEP_WRITER_REFERENCE", "Writer reusable/current reference"
              if path.startswith("cep-writer/authority/"):
                  return "KEEP_PENDING_AUTHORITY_REFRESH", "Writer-relevant authority snapshot; refresh currentity before pruning"
              if path.startswith("cep-writer/"):
                  stale = any(tok in content for tok in old_parent_tokens) or "CORR02" in content or "B3R_CORRECTION02" in content
                  if stale:
                      return "REPLACE_STALE_WRITER_PACKET__NO_DELETE_YET", "mission packet points to older CORR02 parent/mission"
                  return "KEEP_OR_REVIEW_WRITER_PACKET", "Writer packet; inspect mission applicability"
              if path.startswith("dist/"):
                  return "KEEP_PENDING_REBUILD_PROOF__GENERATED_RUNTIME", "generated from canonical source but test/runtime currently consumes dist"
              if path.startswith("assurance/"):
                  if referenced:
                      return "KEEP_ACTIVE_REFERENCED_ASSURANCE", "referenced by tracked repository text/tooling"
                  return "ARCHIVE_CANDIDATE_HISTORICAL_ASSURANCE", "unreferenced assurance; requires custody/content review before removal"
              if path.startswith("archaeology/"):
                  if referenced:
                      return "KEEP_REFERENCED_ARCHAEOLOGY", "still referenced by tracked repository content"
                  return "ARCHIVE_CANDIDATE_ARCHAEOLOGY", "historical archaeology; inspect value/custody before removal"
              if path.startswith("writer-output/"):
                  if referenced:
                      return "KEEP_REFERENCED_WRITER_OUTPUT", "still referenced"
                  return "ARCHIVE_CANDIDATE_WRITER_OUTPUT", "historical Writer output; inspect current use/custody"
              if path.startswith("authority/"):
                  return "KEEP_PENDING_AUTHORITY_CURRENTITY_AUDIT", "authority/reference family; never delete by age"
              if top=="checkpoints":
                  return "REVIEW_CHECKPOINT", "may be lineage or active proof"
              if "/" not in path:
                  if path.lower().startswith("readme") or path.endswith(".md"):
                      return "REVIEW_ROOT_DOCUMENT", "root document may be current navigation or stale handoff"
                  return "REVIEW_ROOT_FILE", "root file requires content review"
              return "REVIEW_UNCLASSIFIED", "requires content inspection"

          for p in paths:
              fp=ROOT/p
              if not fp.is_file(): continue
              digest=sha256(fp)
              content=text_docs.get(str(p),"")
              cls,reason=classify(str(p),content)
              row={
                  "path":str(p),
                  "bytes":fp.stat().st_size,
                  "sha256":digest,
                  "classification":cls,
                  "explicit_path_reference":str(str(p) in explicit_refs).lower(),
                  "reason":reason,
              }
              rows.append(row); by_sha[digest].append(str(p))

          with (OUT/"REPO_CLEANUP_CENSUS.csv").open("w",newline="",encoding="utf-8") as f:
              w=csv.DictWriter(f,fieldnames=list(rows[0].keys()))
              w.writeheader(); w.writerows(sorted(rows,key=lambda r:r["path"]))

          dup_groups=[{"sha256":s,"paths":ps,"bytes_each":next(r["bytes"] for r in rows if r["sha256"]==s)}
                      for s,ps in by_sha.items() if len(ps)>1]
          (OUT/"DUPLICATE_GROUPS.json").write_text(json.dumps(dup_groups,indent=2),encoding="utf-8")

          counts=Counter(r["classification"] for r in rows)
          bytes_by=Counter()
          for r in rows: bytes_by[r["classification"]]+=r["bytes"]

          stale=[r for r in rows if r["classification"]=="REPLACE_STALE_WRITER_PACKET__NO_DELETE_YET"]
          archival=[r for r in rows if r["classification"].startswith("ARCHIVE_CANDIDATE")]
          keep=[r for r in rows if r["classification"].startswith("KEEP")]

          summary=[
              "# CEP Zero-Loss Repository Cleanup Census",
              "",
              f"- Baseline: `{current_baseline}`",
              f"- Tracked files inventoried: **{len(rows)}**",
              f"- Total bytes: **{sum(r['bytes'] for r in rows):,}**",
              f"- Duplicate SHA groups: **{len(dup_groups)}**",
              f"- Stale Writer-packet files requiring replacement before pruning: **{len(stale)}**",
              f"- Archive candidates (NOT deletion-authorized): **{len(archival)}**",
              "",
              "## Classification totals",
              "",
              "| Classification | Files | Bytes |",
              "|---|---:|---:|",
          ]
          for cls,n in sorted(counts.items()):
              summary.append(f"| {cls} | {n} | {bytes_by[cls]:,} |")
          summary += [
              "",
              "## Hard safety rules",
              "",
              "- No file in this census is deletion-authorized by classification alone.",
              "- Product/source/build/test/tooling and Writer reference inputs are KEEP by default.",
              "- Historical assurance/archaeology/writer-output are ARCHIVE_CANDIDATE only until content/custody/reference review.",
              "- Stale current Writer packet files must be replaced with exact post-C03/current-mission material before retirement.",
              "- Generated `dist/` remains KEEP_PENDING_REBUILD_PROOF because current test tooling imports it.",
              "",
              "## Stale Writer packet candidates",
              "",
          ]
          for r in stale:
              summary.append(f"- `{r['path']}`")
          (OUT/"REPO_CLEANUP_SUMMARY.md").write_text("\n".join(summary)+"\n",encoding="utf-8")

          receipt={
              "baseline":current_baseline,
              "files":len(rows),
              "bytes":sum(r["bytes"] for r in rows),
              "classifications":dict(counts),
              "classificationBytes":dict(bytes_by),
              "duplicateGroups":len(dup_groups),
              "staleWriterPacketFiles":len(stale),
              "archiveCandidates":len(archival),
              "deletionAuthorized":False,
              "productMutation":False
          }
          (OUT/"CENSUS_RECEIPT.json").write_text(json.dumps(receipt,indent=2),encoding="utf-8")
          print(json.dumps(receipt,indent=2))
          PY

      - name: Commit census only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "CEP_CONTROLLER"
          git config user.email "cep-controller@local.invalid"
          git add controller-cleanup/REPO_CLEANUP_CENSUS.csv controller-cleanup/DUPLICATE_GROUPS.json controller-cleanup/REPO_CLEANUP_SUMMARY.md controller-cleanup/CENSUS_RECEIPT.json
          git diff --cached --quiet && exit 0
          git commit -m "controller: add zero-loss repository cleanup census"
          git push origin HEAD:controller/zero-loss-repo-cleanup
