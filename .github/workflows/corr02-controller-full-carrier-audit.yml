name: CEP CORR02 C1 Targeted Proof

on:
  push:
    branches:
      - writer/presentation-corr02-google-ai-studio

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prove bounded candidate delta
        shell: bash
        run: |
          set -euo pipefail
          START=bcbb1ac2d09e30b21062fabeccf7a1aaa2b30a2d
          git cat-file -e "$START^{commit}"
          git diff --name-only "$START" HEAD | tee /tmp/c1-delta.txt
          illegal="$(grep -Ev '^(\.github/workflows/corr02-controller-full-carrier-audit.yml|controller-audit/full-carrier-audit.mjs|controller-targeted/targeted-falsification.mjs|stack/native-typescript/(main\.ts|foundation/accepted-runtime\.ts|foundation/workspace\.ts|foundation/workspace-host\.ts|foundation/global/input-ownership-contract\.ts|foundation/global/workspace-host-kernel\.ts|foundation/global/region-contract\.ts|foundation/global/toolbar-template\.ts|surfaces/m0-controller-composition\.ts|adapters/health-runtime\.ts|adapters/processing-runtime\.ts|surfaces/backup/index\.ts|surfaces/audit/index\.ts|surfaces/validation/index\.ts))$' /tmp/c1-delta.txt || true)"
          test -z "$illegal" || { echo "$illegal"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:runtime

      - name: Run targeted C1 falsification
        run: node controller-targeted/targeted-falsification.mjs

      - name: Upload targeted evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corr02-c1-targeted-proof
          path: controller-targeted-output/
          if-no-files-found: error
          retention-days: 30
