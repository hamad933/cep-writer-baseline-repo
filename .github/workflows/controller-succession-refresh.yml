name: CEP Controller Succession Refresh

on:
  push:
    branches:
      - infra/gdrive-credential-smoke
    paths:
      - .github/workflows/controller-succession-refresh.yml

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Refresh stable succession handoff, bootstrap, lessons, and live state
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          IDS={"handoff":"1xoKHKftEkB5HIYK0vh2xtSojeA5axAme","bootstrap":"1gQyQAZBblv7Fs1pKtj3TqZahmGztx0EU","lessons":"1uqhEP1MjLfAUXOikroTRxS5-64HUwM2b","state":"164CDevKZ48ZAXke44oL3jXIVpYQJBmRu"}
          HANDOFF=base64.b64decode("").decode("utf-8")
          BOOTSTRAP=base64.b64decode("").decode("utf-8")
          LESSON=base64.b64decode("").decode("utf-8")
          STATE_LINE=base64.b64decode("").decode("utf-8")

          info=json.loads(base64.b64decode(os.environ["GDRIVE_SA_JSON_B64"]).decode())
          creds=service_account.Credentials.from_service_account_info(info,scopes=["https://www.googleapis.com/auth/drive"])
          creds.refresh(Request())
          headers={"Authorization":f"Bearer {creds.token}"}

          def read(fid):
              r=requests.get(f"https://www.googleapis.com/drive/v3/files/{fid}",headers=headers,params={"alt":"media"},timeout=60)
              r.raise_for_status()
              return r.content.decode("utf-8-sig")

          def write(fid,text):
              r=requests.patch(f"https://www.googleapis.com/upload/drive/v3/files/{fid}",headers={**headers,"Content-Type":"text/markdown; charset=utf-8"},params={"uploadType":"media"},data=text.encode("utf-8"),timeout=60)
              r.raise_for_status()

          write(IDS["handoff"],HANDOFF)
          write(IDS["bootstrap"],BOOTSTRAP)

          lessons=read(IDS["lessons"])
          lmark="## I. Repository cleanup / baseline-minimality lessons — 2026-09-24"
          lessons=(lessons[:lessons.index(lmark)].rstrip()+"\n\n" if lmark in lessons else lessons.rstrip()+"\n\n")+LESSON.rstrip()+"\n"
          write(IDS["lessons"],lessons)

          state=read(IDS["state"])
          smark="- Controller succession preparation — 2026-09-24:"
          if smark in state:
              start=state.index(smark); end=state.find("\n",start); end=len(state) if end<0 else end
              state=state[:start]+STATE_LINE+state[end:]
          else:
              anchor="- Post-integration repository cleanliness recheck — 2026-09-24:"
              pos=state.find(anchor)
              if pos<0: pos=state.find("- Active mission class:")
              if pos<0: raise RuntimeError("CURRENT_STATE insertion anchor missing")
              end=state.find("\n",pos); end=len(state) if end<0 else end
              state=state[:end+1]+STATE_LINE+"\n"+state[end+1:]
          write(IDS["state"],state)

          expected={"handoff":"main@16aafaec71706ebbb13b002395f72383b2e77a81","bootstrap":"REPOSITORY_HISTORICAL_BULK_REDUCTION_OPEN__NOT_PRODUCT_BLOCKER","lessons":"Current-tip size and Git-history size are different","state":"Controller succession preparation — 2026-09-24"}
          for key,fid in IDS.items():
              body=read(fid)
              if expected[key] not in body: raise RuntimeError(f"readback failed for {key}")
              print(key,len(body.encode("utf-8")),hashlib.sha256(body.encode("utf-8")).hexdigest())
          print("CONTROLLER_SUCCESSION_REFRESH_PASS")
          PY
