name: CEP Writer Workspace Capsule

on:
  push:
    branches:
      - 'capsule/**'
    paths:
      - '.github/workflows/build-writer-workspace-capsule.yml'
      - 'tools/writer-capsule/**'
      - 'mission-overlay/**'
      - 'cep-writer/CAPSULE_BINDING.template.json'
  workflow_dispatch:
    inputs:
      mission_id:
        description: Mission ID override
        required: false
        default: ''
      binding_path:
        description: Repo-local mission binding JSON
        required: false
        default: 'mission-overlay/CAPSULE_BINDING.json'
      visual_config_path:
        description: Repo-local optional visual bootstrap config
        required: false
        default: 'mission-overlay/CAPSULE_VISUAL_BOOTSTRAP.json'

permissions:
  contents: read

jobs:
  build-capsule:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare optional exact-parent visual bootstrap
        env:
          VISUAL_CONFIG: ${{ inputs.visual_config_path || 'mission-overlay/CAPSULE_VISUAL_BOOTSTRAP.json' }}
        run: |
          python tools/writer-capsule/prepare_visual_bootstrap.py             --repo-root .             --config "$VISUAL_CONFIG"             --output .capsule-visual-bootstrap

      - name: Build capsule payload
        env:
          BINDING_PATH: ${{ inputs.binding_path || 'mission-overlay/CAPSULE_BINDING.json' }}
          MISSION_ID: ${{ inputs.mission_id }}
        run: |
          args=(--repo-root . --output writer-capsule-out --visual-bootstrap .capsule-visual-bootstrap --binding "$BINDING_PATH")
          if [ -n "$MISSION_ID" ]; then args+=(--mission "$MISSION_ID"); fi
          python tools/writer-capsule/build_capsule.py "${args[@]}"

      - name: Verify generated capsule
        run: |
          python writer-capsule-out/verify_capsule.py writer-capsule-out
          git bundle verify writer-capsule-out/repo.bundle
          cat writer-capsule-out/CAPSULE_MANIFEST.json
          cat writer-capsule-out/visual-bootstrap/VISUAL_BOOTSTRAP_MANIFEST.json
          cat writer-capsule-out/SHA256SUMS.txt

      - name: Prove clean local materialization
        run: |
          rm -rf /tmp/cep-capsule-smoke
          bash writer-capsule-out/bootstrap.sh /tmp/cep-capsule-smoke
          test "$(git -C /tmp/cep-capsule-smoke rev-parse HEAD)" = "$(git rev-parse HEAD)"
          test -z "$(git -C /tmp/cep-capsule-smoke status --porcelain)"

      - uses: actions/upload-artifact@v4
        with:
          name: CEP_WRITER_WORKSPACE_CAPSULE-${{ github.run_id }}
          path: writer-capsule-out/
          if-no-files-found: error
          compression-level: 0
          include-hidden-files: true
          retention-days: 14
