name: CEP Writer Workspace Capsule

on:
  push:
    branches:
      - controller/writer-workspace-capsule-v1
      - 'capsule/**'
    paths:
      - '.github/workflows/build-writer-workspace-capsule.yml'
      - 'tools/writer-capsule/**'
      - 'cep-writer/**'
      - 'stack/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-capsule:
    name: Build Controller-prepared exact Writer capsule
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Prepare bounded exact-parent visual bootstrap
        run: |
          python tools/writer-capsule/prepare_visual_bootstrap.py \
            --repo-root . \
            --config cep-writer/CAPSULE_VISUAL_BOOTSTRAP.json \
            --output .capsule-visual-bootstrap

      - name: Build capsule payload
        run: |
          python tools/writer-capsule/build_capsule.py \
            --repo-root . \
            --output writer-capsule-out \
            --visual-bootstrap .capsule-visual-bootstrap

      - name: Verify generated capsule
        run: |
          python writer-capsule-out/verify_capsule.py writer-capsule-out
          git bundle verify writer-capsule-out/repo.bundle
          cat writer-capsule-out/CAPSULE_MANIFEST.json
          cat writer-capsule-out/visual-bootstrap/VISUAL_BOOTSTRAP_MANIFEST.json
          cat writer-capsule-out/SHA256SUMS.txt

      - name: Prove clean local materialization
        run: |
          rm -rf /tmp/cep-capsule-smoke
          bash writer-capsule-out/bootstrap.sh /tmp/cep-capsule-smoke
          test "$(git -C /tmp/cep-capsule-smoke rev-parse HEAD)" = "$(git rev-parse HEAD)"
          test -z "$(git -C /tmp/cep-capsule-smoke status --porcelain)"

      - name: Upload one ready-to-work inbound capsule
        uses: actions/upload-artifact@v4
        with:
          name: CEP_WRITER_WORKSPACE_CAPSULE-${{ github.run_id }}
          path: writer-capsule-out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
