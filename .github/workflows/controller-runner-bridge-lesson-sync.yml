name: CEP Runner Bridge Lesson Sync

on:
  push:
    branches:
      - infra/gdrive-credential-smoke
    paths:
      - .github/workflows/controller-runner-bridge-lesson-sync.yml

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --quiet google-auth requests
      - name: Sync durable runner-bridge lesson and handoff note
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request
          IDS={"lessons":"1uqhEP1MjLfAUXOikroTRxS5-64HUwM2b","handoff":"1xoKHKftEkB5HIYK0vh2xtSojeA5axAme"}
          LESSON=base64.b64decode("").decode("utf-8")
          HAND=base64.b64decode("").decode("utf-8")
          info=json.loads(base64.b64decode(os.environ["GDRIVE_SA_JSON_B64"]).decode())
          creds=service_account.Credentials.from_service_account_info(info,scopes=["https://www.googleapis.com/auth/drive"])
          creds.refresh(Request()); headers={"Authorization":f"Bearer {creds.token}"}
          def read(fid):
            r=requests.get(f"https://www.googleapis.com/drive/v3/files/{fid}",headers=headers,params={"alt":"media"},timeout=30)
            r.raise_for_status(); return r.content.decode("utf-8-sig")
          def write(fid,text):
            r=requests.patch(f"https://www.googleapis.com/upload/drive/v3/files/{fid}",headers={**headers,"Content-Type":"text/markdown; charset=utf-8"},params={"uploadType":"media"},data=text.encode("utf-8"),timeout=30)
            r.raise_for_status()
          lessons=read(IDS["lessons"])
          lmark="### GitHub workflow/runner bridge for multi-file or high-volume repository changes"
          if lmark in lessons:
            s=lessons.index(lmark); e=lessons.find("\n### ",s+4); e=len(lessons) if e<0 else e
            lessons=lessons[:s]+LESSON.rstrip()+"\n\n"+lessons[e:].lstrip()
          else:
            lessons=lessons.rstrip()+"\n\n"+LESSON.rstrip()+"\n"
          write(IDS["lessons"],lessons)

          hand=read(IDS["handoff"])
          hmark="## 9.1 GitHub workflow/runner bridge for bulk or multi-file Controller operations"
          if hmark in hand:
            s=hand.index(hmark); e=hand.find("\n## ",s+4); e=len(hand) if e<0 else e
            hand=hand[:s]+HAND.rstrip()+"\n\n"+hand[e:].lstrip()
          else:
            anchor="## 10. Failure-handling strategy"
            p=hand.find(anchor)
            if p<0: hand=hand.rstrip()+"\n\n"+HAND.rstrip()+"\n"
            else: hand=hand[:p]+HAND.rstrip()+"\n\n"+hand[p:]
          write(IDS["handoff"],hand)

          assert lmark in read(IDS["lessons"])
          assert hmark in read(IDS["handoff"])
          print("RUNNER_BRIDGE_LESSON_SYNC_PASS")
          PY
