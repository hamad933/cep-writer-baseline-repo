name: GDrive Credential Smoke Test

on:
  push:
    branches:
      - infra/gdrive-credential-smoke
    paths:
      - .github/workflows/gdrive-credential-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gdrive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_USER_CLIENT_ID: ${{ secrets.GDRIVE_USER_CLIENT_ID }}
      GDRIVE_USER_CLIENT_SECRET: ${{ secrets.GDRIVE_USER_CLIENT_SECRET }}
      GDRIVE_USER_REFRESH_TOKEN: ${{ secrets.GDRIVE_USER_REFRESH_TOKEN }}
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}

    steps:
      - name: Checkout smoke-test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact CEP working baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          EXTRA="$(git diff --name-only "$BASE"...HEAD | grep -v '^\.github/workflows/gdrive-credential-smoke\.yml$' || true)"
          test -z "$EXTRA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install auth dependency
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Test Google Drive authentication and exact-ID reads
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import json
          import os
          import sys
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          FILES = {
              "CURRENT_STATE": "164CDevKZ48ZAXke44oL3jXIVpYQJBmRu",
              "POST_C03_PLAN": "1-ZpY8NHQDdBziM7ik0MO_dkEJIbbteInKWj8xMR67wM",
              "CORR03_DELTA": "1zyO3-EN7ZVvM3FzDx1EoSH1zyA_V8ZiU",
          }

          def drive_get(token, file_id):
              response = requests.get(
                  f"https://www.googleapis.com/drive/v3/files/{file_id}",
                  headers={"Authorization": f"Bearer {token}"},
                  params={
                      "fields": "id,name,mimeType,size,md5Checksum,parents",
                      "supportsAllDrives": "true",
                  },
                  timeout=30,
              )
              if response.status_code != 200:
                  raise RuntimeError(
                      f"Drive metadata read failed for {file_id}: HTTP {response.status_code}"
                  )
              return response.json()

          def get_user_access_token():
              required = (
                  "GDRIVE_USER_CLIENT_ID",
                  "GDRIVE_USER_CLIENT_SECRET",
                  "GDRIVE_USER_REFRESH_TOKEN",
              )
              missing = [key for key in required if not os.environ.get(key)]
              if missing:
                  raise RuntimeError("Missing user OAuth secret name(s): " + ",".join(missing))

              response = requests.post(
                  "https://oauth2.googleapis.com/token",
                  data={
                      "client_id": os.environ["GDRIVE_USER_CLIENT_ID"],
                      "client_secret": os.environ["GDRIVE_USER_CLIENT_SECRET"],
                      "refresh_token": os.environ["GDRIVE_USER_REFRESH_TOKEN"],
                      "grant_type": "refresh_token",
                  },
                  timeout=30,
              )
              if response.status_code != 200:
                  try:
                      payload = response.json()
                      code = payload.get("error", "unknown_error")
                      description = payload.get("error_description", "")
                  except Exception:
                      code = "non_json_error"
                      description = ""
                  raise RuntimeError(
                      f"User OAuth token refresh failed: HTTP {response.status_code}; "
                      f"error={code}; description={description}"
                  )
              return response.json()["access_token"]

          rows = []

          user_ok = False
          try:
              user_access_token = get_user_access_token()
              for label, file_id in FILES.items():
                  metadata = drive_get(user_access_token, file_id)
                  rows.append(
                      (
                          "USER_OAUTH",
                          label,
                          "PASS",
                          metadata.get("name", ""),
                          metadata.get("size", ""),
                      )
                  )
              user_ok = True
          except Exception as exc:
              print(f"USER_OAUTH_FAIL: {exc}")

          service_account_auth_ok = False
          service_account_read_count = 0
          service_account_blob = os.environ.get("GDRIVE_SA_JSON_B64", "")
          if service_account_blob:
              try:
                  info = json.loads(base64.b64decode(service_account_blob).decode("utf-8"))
                  credentials = service_account.Credentials.from_service_account_info(
                      info,
                      scopes=["https://www.googleapis.com/auth/drive.readonly"],
                  )
                  credentials.refresh(Request())
                  service_account_auth_ok = True

                  for label, file_id in FILES.items():
                      try:
                          metadata = drive_get(credentials.token, file_id)
                          rows.append(
                              (
                                  "SERVICE_ACCOUNT",
                                  label,
                                  "PASS",
                                  metadata.get("name", ""),
                                  metadata.get("size", ""),
                              )
                          )
                          service_account_read_count += 1
                      except Exception:
                          rows.append(("SERVICE_ACCOUNT", label, "NO_ACCESS", "", ""))
              except Exception as exc:
                  print(f"SERVICE_ACCOUNT_AUTH_FAIL: {type(exc).__name__}")

          print("AUTH_PATH,OBJECT,STATUS,NAME,SIZE")
          for row in rows:
              print(",".join(str(value).replace("\n", " ").replace(",", ";") for value in row))

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Google Drive credential smoke test\n\n")
                  summary.write(
                      f"- User OAuth exact-ID read: {'PASS' if user_ok else 'FAIL'}\n"
                  )
                  summary.write(
                      "- Service Account authentication: "
                      f"{'PASS' if service_account_auth_ok else 'FAIL/UNAVAILABLE'}\n"
                  )
                  summary.write(
                      f"- Service Account exact-ID reads: {service_account_read_count}/{len(FILES)}\n"
                  )
                  summary.write("- No secret or access-token values were printed.\n")

          service_account_full_read = service_account_read_count == len(FILES)
          if not (user_ok or service_account_full_read):
              sys.exit(1)
          PY
