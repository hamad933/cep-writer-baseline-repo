name: GDrive Credential Smoke Test

on:
  push:
    branches:
      - infra/gdrive-credential-smoke
    paths:
      - .github/workflows/gdrive-credential-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gdrive-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GDRIVE_USER_CLIENT_ID: ${{ secrets.GDRIVE_USER_CLIENT_ID }}
      GDRIVE_USER_CLIENT_SECRET: ${{ secrets.GDRIVE_USER_CLIENT_SECRET }}
      GDRIVE_USER_REFRESH_TOKEN: ${{ secrets.GDRIVE_USER_REFRESH_TOKEN }}
      GDRIVE_SA_JSON_B64: ${{ secrets.GDRIVE_SA_JSON_B64 }}
    steps:
      - name: Checkout smoke-test branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact CEP working baseline ancestry
        shell: bash
        run: |
          set -euo pipefail
          BASE=293dd1e0e2e6cb61bea5b42abd2cba39847e3c6a
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          EXTRA="$(git diff --name-only "$BASE"...HEAD | grep -v '^.github/workflows/gdrive-credential-smoke.yml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install auth dependency
        run: python -m pip install --disable-pip-version-check --quiet google-auth requests

      - name: Test Google Drive authentication and exact-ID reads
        shell: bash
        run: |
          python - <<'PY'
          import base64, json, os, sys
          import requests
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          FILES = {
              "CURRENT_STATE": "164CDevKZ48ZAXke44oL3jXIVpYQJBmRu",
              "POST_C03_PLAN": "1-ZpY8NHQDdBziM7ik0MO_dkEJIbbteInKWj8xMR67wM",
              "CORR03_DELTA": "1zyO3-EN7ZVvM3FzDx1EoSH1zyA_V8ZiU",
          }

          def drive_get(token, file_id):
              url = f"https://www.googleapis.com/drive/v3/files/{file_id}"
              params = {
                  "fields": "id,name,mimeType,size,md5Checksum,parents",
                  "supportsAllDrives": "true",
              }
              r = requests.get(
                  url,
                  headers={"Authorization": f"Bearer {token}"},
                  params=params,
                  timeout=30,
              )
              if r.status_code != 200:
                  raise RuntimeError(f"Drive GET failed for {file_id}: HTTP {r.status_code}")
              return r.json()

          def user_token():
              required = [
                  "GDRIVE_USER_CLIENT_ID",
                  "GDRIVE_USER_CLIENT_SECRET",
                  "GDRIVE_USER_REFRESH_TOKEN",
              ]
              missing = [k for k in required if not os.environ.get(k)]
              if missing:
                  raise RuntimeError("Missing user OAuth secrets: " + ",".join(missing))
              r = requests.post(
                  "https://oauth2.googleapis.com/token",
                  data={
                      "client_id": os.environ["GDRIVE_USER_CLIENT_ID"],
                      "client_secret": os.environ["GDRIVE_USER_CLIENT_SECRET"],
                      "refresh_token": os.environ["GDRIVE_USER_REFRESH_TOKEN"],
                      "grant_type": "refresh_token",
                  },
                  timeout=30,
              )
              if r.status_code != 200:
                  raise RuntimeError(f"User OAuth token refresh failed: HTTP {r.status_code}")
              return r.json()["access_token"]

          results = []
          try:
              token = user_token()
              for label, fid in FILES.items():
                  meta = drive_get(token, fid)
                  results.append(("USER_OAUTH", label, "PASS", meta.get("name",""), meta.get("size","")))
              user_ok = True
          except Exception as e:
              print(f"USER_OAUTH_FAIL: {e}")
              user_ok = False

          sa_ok = False
          sa_blob = os.environ.get("GDRIVE_SA_JSON_B64", "")
          if sa_blob:
              try:
                  info = json.loads(base64.b64decode(sa_blob).decode("utf-8"))
                  creds = service_account.Credentials.from_service_account_info(
                      info,
                      scopes=["https://www.googleapis.com/auth/drive.readonly"],
                  )
                  creds.refresh(Request())
                  sa_ok = True
                  for label, fid in FILES.items():
                      try:
                          meta = drive_get(creds.token, fid)
                          results.append(("SERVICE_ACCOUNT", label, "PASS", meta.get("name",""), meta.get("size","")))
                      except Exception:
                          results.append(("SERVICE_ACCOUNT", label, "NO_ACCESS", "", ""))
              except Exception as e:
                  print(f"SERVICE_ACCOUNT_AUTH_FAIL: {type(e).__name__}")

          print("AUTH_PATH,OBJECT,STATUS,NAME,SIZE")
          for row in results:
              safe = [str(x).replace("\n"," ").replace(",",";") for x in row]
              print(",".join(safe))

          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as f:
                  f.write("## Google Drive credential smoke test\n\n")
                  f.write(f"- User OAuth exact-ID read: {'PASS' if user_ok else 'FAIL'}\n")
                  f.write(f"- Service Account authentication: {'PASS' if sa_ok else 'FAIL/UNAVAILABLE'}\n")
                  f.write("- No secret/token values were printed.\n")

          if not user_ok:
              sys.exit(1)
          PY
 || true)"
          test -z "$EXTRA"

